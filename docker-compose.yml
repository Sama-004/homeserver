services:
  chicken-tracker:
    build: .
    container_name: chicken-breast-tracker
    restart: unless-stopped
    # config.json holds your lat/lon + ntfy topic; state.json persists stock state.
    volumes:
      - ./config.json:/app/config.json:ro
      - ./state.json:/app/state.json
    # Secrets (NTFY_TOPIC, LAT, LON) are read from .env (gitignored):
    env_file:
      - .env
    # A bit of memory headroom for Chromium
    shm_size: "512mb"
