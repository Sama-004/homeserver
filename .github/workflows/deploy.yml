name: deploy

# Push to main -> an ephemeral GitHub-hosted runner joins the tailnet over Tailscale,
# SSHes into the homeserver, and redeploys in place (cached Docker build).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-homeserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load deploy SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: Pull latest and redeploy on the homeserver
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy "${{ secrets.SSH_TARGET }}" '
            set -euo pipefail
            cd ~/chicken-breast-tracker-blinkit
            git fetch --prune origin
            git reset --hard origin/main            # leaves untracked .env / */data intact
            # one-time monorepo migration: chicken state used to live in ./data
            if [ -d data ] && [ ! -e chicken-breast/data ]; then mv data chicken-breast/data; fi
            mkdir -p chicken-breast/data nimas/data
            docker compose up -d --build            # cached build: reuses the 2GB base
            docker image prune -f
            docker compose ps
          '
