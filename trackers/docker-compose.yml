# One service per tracker. Each tracker is self-contained in its own directory;
# this file is the only place that knows about all of them.
# Secrets (NTFY_TOPIC, LAT, LON, HC_PING_KEY) live in the shared root .env (gitignored).

# What every tracker shares. run-loop.sh is the container's long-lived process: it runs
# `node tracker.mjs --once`, then sleeps until the time the tracker wrote to data/next-run,
# so Node only exists during a check.
# `<<:` merges are shallow: a service that sets `volumes:` replaces the whole list, so each
# service lists the run-loop.sh mount itself, and extra env goes through `<<: *tracker-env`.
# HC_SLUG is the service name: run-loop.sh pings that healthchecks.io check after every
# good check, and healthchecks-setup.sh creates one check per service that sets it.
x-tracker: &tracker
  restart: unless-stopped
  env_file:
    - .env
  command: ["sh", "/run-loop.sh"]
  environment: &tracker-env
    STATE_PATH: /app/data/state.json
    TZ: Asia/Kolkata # daily heartbeat hours and parsed booking times are IST

services:
  chicken-tracker:
    <<: *tracker
    build: ./chicken-breast
    container_name: chicken-breast-tracker
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./chicken-breast/config.json:/app/config.json:ro
      - ./chicken-breast/data:/app/data # directory mount (no single-file EISDIR trap)
    environment:
      <<: *tracker-env
      HC_SLUG: chicken-tracker

  nimas-notifier:
    <<: *tracker
    build: ./nimas
    container_name: nimas-notifier
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./nimas/config.json:/app/config.json:ro
      - ./nimas/data:/app/data
    environment:
      <<: *tracker-env
      HC_SLUG: nimas-notifier

  iism-notifier:
    <<: *tracker
    build: ./iism
    container_name: iism-notifier
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./iism/config.json:/app/config.json:ro
      - ./iism/data:/app/data
    environment:
      <<: *tracker-env
      HC_SLUG: iism-notifier

  amul-notifier:
    <<: *tracker
    build: ./amul
    container_name: amul-notifier
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./amul/config.json:/app/config.json:ro
      - ./amul/data:/app/data
    environment:
      <<: *tracker-env
      HC_SLUG: amul-notifier

  # Paused: `docker compose up` (and so every deploy) skips a service whose profile isn't
  # enabled. Delete the profiles line to run it again.
  amazon-notifier:
    <<: *tracker
    profiles: [paused]
    build: ./amazon
    container_name: amazon-notifier
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./amazon/config.json:/app/config.json:ro
      - ./amazon/data:/app/data
    environment:
      <<: *tracker-env
      HC_SLUG: amazon-notifier

  uniqlo-notifier:
    <<: *tracker
    build: ./uniqlo
    container_name: uniqlo-notifier
    volumes:
      - ./run-loop.sh:/run-loop.sh:ro
      - ./uniqlo/config.json:/app/config.json:ro
      - ./uniqlo/data:/app/data
    environment:
      <<: *tracker-env
      HC_SLUG: uniqlo-notifier
